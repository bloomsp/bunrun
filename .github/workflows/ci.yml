name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          BUNRUN_VIEW_PASSWORD: ci-view-password
          BUNRUN_ADMIN_PASSWORD: ci-admin-password

      - name: Smoke-test Worker preview
        run: npm run smoke:worker
        env:
          BUNRUN_VIEW_PASSWORD: ci-view-password
          BUNRUN_ADMIN_PASSWORD: ci-admin-password
